[project]
name = "backend"
version = "0.1.0"
description = "Бэкенд сервис для оплаты."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "taskiq>=0.11.0",
    "uvicorn[standard]>=0.34.0",
    "redis>=5.2.0",
    "faststream[kafka]>=0.5.34",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "grpcio-reflection>=1.68.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "taskiq-redis>=1.0.0",
    "taskiq-faststream>=0.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-grpc>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[dependency-groups]
dev = [
    "docker>=7.0.0",
    "httpx>=0.28.1",
    "pytest>=7.4.2",
    "pytest-asyncio>=0.22.0",
    "pytest-cov>=5.3.1",
    "respx>=0.22.0",
    "testcontainers[kafka,postgres,redis]>=4.0.0",
]
lint = [
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты против реальной инфраструктуры: Postgres — стенд либо testcontainer, observability — docker compose; пропускаются, если стенда и Docker нет",
]

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = ["src"]
exclude = [
    "tests/",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "COM",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN003",
    "ANN401",
    "ARG001",
    "ARG005",
    "B008",
    "B904",
    "COM812",
    "RUF002",
    "RUF012",
    "S101",
]
# Кириллица в коде и комментариях — осознанный выбор проекта (весь код,
# docstring'и и README написаны по-русски). RUF001/002/003 считают русские
# буквы «неоднозначными» относительно латиницы (с/с, е/e, о/o ...), поэтому
# перечисляем используемые буквы как разрешённые, иначе линтер ругается на
# каждый русский текст. Настоящие опечатки (кириллица в идентификаторах)
# по-прежнему отлавливаются правилами N (pep8-naming) и F (pyflakes).
allowed-confusables = [
    "а", "б", "в", "г", "д", "е", "ж", "з", "и", "й",
    "к", "л", "м", "н", "о", "п", "р", "с", "т", "у",
    "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э",
    "ю", "я",
    "А", "Б", "В", "Г", "Д", "Е", "Ж", "З", "И", "Й",
    "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У",
    "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э",
    "Ю", "Я",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = [
    "E402",
    "F401",
]
# N818 требует суффикс Error у всех исключений, но имена доменных ошибок
# зафиксированы планом эпика 1 (docs/plan/epic-01-domain/plan.md, T-1.5):
# InsufficientFunds, AccountBlocked, InvalidTransition, DuplicateOperation.
# Это предметные названия бизнес-отказов, а не «ошибки парсинга», поэтому
# переименовывать их ради линтера мы не будем — просто отключаем правило
# для файла, где живёт вся иерархия доменных исключений.
# Паттерн с **/ нужен потому, что ruff запускается и из backend/ (make lint),
# и из корня репозитория (pre-commit), а относительные пути он разрешает
# относительно текущего каталога.
"**/core_service/domain/exceptions.py" = [
    "N818",
]

"**/tests/*" = [
    "ANN",
    "S101",
    "S105",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
cache_dir = "$MYPY_CONFIG_FILE_DIR/.mypy_cache"
explicit_package_bases = true
strict = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
python_version = "3.14"
exclude = [
    "tests/",
    "alembic/",
    "storage/",
]

[tool.codespell]
ignore-words-list = "selectin,ot"
