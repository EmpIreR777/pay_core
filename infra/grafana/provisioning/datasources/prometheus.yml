# ==============================================================================
# Grafana — provisioning datasources.
#
# Источник данных — Prometheus, который скрейпит метрики OTel Collector'а.
# Дашборды НЕ поставляются: на этапе Эпика 0 достаточно подключённого
# datasource, сами дашборды появятся вместе с метриками приложения.
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Интервал соответствует scrape_interval из prometheus.yml.
      timeInterval: 15s
