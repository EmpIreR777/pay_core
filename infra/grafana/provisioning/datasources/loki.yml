apiVersion: 1

datasources:
  - name: Loki
    # Третий сигнал телеметрии. Loki, как и Jaeger, НЕ хранит у Grafana
    # ничего: это «окно» в хранилище логов. Что он даёт:
    #   * Explore → Loki: полнотекстовый поиск по логам прямо в Grafana
    #   * панели логов на дашборде рядом с графиками метрик
    #   * derived field TraceID: клик по trace_id открывает трейс в Jaeger
    #
    # ЛОГИ ХРАНЯТСЯ (том loki-data, retention 7d) — в отличие от трейсов
    # в Jaeger, которые живут только в RAM. Это ключевое различие: лог
    # переживает рестарт Jaeger, поэтому постфактум разбор инцидента
    # («что было в 03:15, когда роняло деплой») возможен только через Loki.
    #
    # uid задан явно по той же причине, что и у Jaeger: на uid: jaeger
    # ссылается derivedField ниже, а автосгенерированный uid нестабилен.
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Сколько строк тянуть за один запрос. Loki отдаёт постранично;
      # 1000 — компромисс между «хватит для чтения» и «не повесит браузер».
      maxLines: 1000
      derivedFields:
        # Клик по trace_id в строке лога открывает трейс в Jaeger:
        # из лога — в трейс одним кликом, без копирования 32-символьного id.
        #
        # matcherRegex ищет подстроку `trace_id=<hex>` в ТЕКСТЕ логовой
        # строки, поэтому приложения обязаны писать trace_id в само
        # сообщение. Это задача T-12.10 (structlog с автоподмешиванием
        # trace_id/span_id). Пока приложение этого не делает, ссылки не
        # появятся, но сам Loki и поиск по нему уже работают.
        - name: TraceID
          matcherRegex: 'trace_id=(\w+)'
          # '$${__value.raw}' — экранированный в YAML спецшаблон Grafana:
          # подставляется реальный trace_id, открывается поиск в Jaeger.
          url: '$${__value.raw}'
          datasourceUid: jaeger
        - name: SpanID
          # Показываем как метку, но без ссылки: Grafana не умеет открывать
          # span внутри трейса по одному лишь span_id.
          matcherRegex: 'span_id=(\w+)'
          url: ''
