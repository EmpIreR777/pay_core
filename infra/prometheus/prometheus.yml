# ==============================================================================
# Prometheus — конфигурация сбора метрик.
#
# ВАЖНО: приложение НЕ экспортирует метрики напрямую в Prometheus.
# Согласно архитектуре (PLAN.md), приложение отправляет всю телеметрию
# в OTel Collector по OTLP, а Collector пробрасывает метрики в Prometheus
# через свой prometheus-экспортёр на :8889. Prometheus только скрейпит его.
# ==============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: local
    project: pay-core

scrape_configs:
  # Метрики самого Prometheus (self-monitoring).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики OTel Collector (:8889) — сюда попадает телеметрия приложений,
  # транслированная Collector'ом (ветки приложения появятся в T-0.7).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
